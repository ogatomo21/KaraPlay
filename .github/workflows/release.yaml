name: Android Release Build and Publish

on:
  push:
    tags:
      - 'v*' # 'v' から始まるタグがプッシュされた時に実行

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 # compileSdk 36 の環境に合わせて17以上を指定
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # --- 署名（Keystore）の設定 ---
      # ※ 事前にGitHub Secretsに登録が必要です
      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $ENCODED_KEYSTORE | base64 -d > app/keystore.jks

      - name: Build Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # split abi が有効なため、このコマンドで複数のAPKが生成されます
        run: ./gradlew assembleRelease

      # --- ファイルのリネーム処理 ---
      - name: Rename APKs
        run: |
          # 実行されたタグ名（例: v1.0.0）を取得
          TAG_NAME=${{ github.ref_name }}
          
          cd app/build/outputs/apk/release/
          
          # 生成されたすべての .apk ファイルに対してループ処理
          for file in *.apk; do
            # デフォルト名: app-arm64-v8a-release.apk
            # sedコマンドで 'app-' を 'karaplay-タグ名-' に変更し、'-release' を削除
            NEW_NAME=$(echo $file | sed "s/app-/karaplay-${TAG_NAME}-/" | sed "s/-release//")
          
            mv "$file" "$NEW_NAME"
            echo "Renamed: $file -> $NEW_NAME"
          done

      # --- GitHub Releaseへのアップロード ---
      - name: Create GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          name: KaraPlay ${{ github.ref_name }}
          generate_release_notes: true
          # リネームしたファイルをすべてアップロード対象にする
          files: app/build/outputs/apk/release/karaplay-*.apk